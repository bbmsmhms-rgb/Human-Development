<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنمية بشرية</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <span class="menu-icon" onclick="toggleMenu()"><i class="fas fa-leaf"></i></span>
        <div class="logo"><img src="photo/logo.png" alt="Logo"></div>
    </header>

    <nav class="sidebar" id="sidebar">
        <a href="#"><i class="fas fa-house"></i> Home</a>
        <a href="#"><i class="fas fa-language"></i> Language</a>
        <a href="#"><i class="fas fa-users"></i> About us</a>
        <a href="#"><i class="fas fa-mobile"></i> Show app</a>
        <a href="#"><i class="fas fa-gear"></i> Setting</a>
    </nav>

    <div class="slider-wrapper">
        <div class="slider-container">
            <div class="slider" id="slider">
                <div class="slide"><img src="photo/a1.jpg" alt="Slide 1"></div>
                <div class="slide"><img src="photo/a2.jpg" alt="Slide 2"></div>
                <div class="slide"><img src="photo/a3.jpg" alt="Slide 3"></div>
                <div class="slide"><img src="photo/a4.jpg" alt="Slide 4"></div>
                <div class="slide"><img src="photo/a2.jpg" alt="Slide 5"></div>
                <div class="slide"><img src="photo/a1.jpg" alt="Slide 6"></div>
            </div>
            <div class="arrows">
                <span class="arrow right" onclick="nextSlide()"><i class="fas fa-chevron-right"></i></span>
                <span class="arrow left" onclick="prevSlide()"><i class="fas fa-chevron-left"></i></span>
            </div>
            <div class="dots"></div>
        </div>
    </div>

    <div class="buttons-container">
        <button><i class="fas fa-hand-holding-heart"></i> الحملات التطوعية</button>
        <button><i class="fas fa-people-roof"></i> التكافل الاجتماعي</button>
        <button><i class="fas fa-seedling"></i> المبادرات المجتمعية</button>
        <button><i class="fas fa-lightbulb"></i> التوعية والارشاد</button>
        <button class="guide-button" id="guideBtn"><i class="fas fa-book"></i> الدليل التوعوي الموحد</button>
    </div>

    <div class="input-area">
        <p>اقترح أو سجل حملة تطوعية</p>
        <div class="topic-buttons">
            <button onclick="selectTopic('الحملات التطوعية - ')"><i class="fas fa-hand-holding-heart"></i> الحملات التطوعية</button>
            <button onclick="selectTopic('التكافل الاجتماعي - ')"><i class="fas fa-people-roof"></i> التكافل الاجتماعي</button>
            <button onclick="selectTopic('المبادرات المجتمعية - ')"><i class="fas fa-seedling"></i> المبادرات المجتمعية</button>
            <button onclick="selectTopic('التوعية والارشاد - ')"><i class="fas fa-lightbulb"></i> التوعية والارشاد</button>
        </div>
        <input type="text" id="messageInput" placeholder="اختر نوع الحملة ثم سجل رسالتك هنا...">
        <button id="sendBtn">إرسال</button>
    </div>

    <script src="script.js"></script>

</body>

</html>
